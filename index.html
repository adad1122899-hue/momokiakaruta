<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a84e70"><link rel="manifest" href="manifest.json"><title>ラジオかるた記録帳</title>
<style>
:root{--accent:#a84e70;--ink:#45343c;--bg:#fff8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif}main{max-width:850px;margin:auto;padding:16px 14px 40px}header{text-align:center;padding:12px 0}h1{font-size:1.45rem;margin:0}header p{color:#896e7b}.panel{background:white;border:1px solid #eedce4;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 3px 12px #7340500a}label{display:block;font-weight:700;font-size:.9rem;margin:9px 0 5px}input,textarea,select{width:100%;font:inherit;color:var(--ink);border:1px solid #e5cbd5;border-radius:10px;padding:10px;background:white}textarea{min-height:120px;resize:vertical}button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:white;cursor:pointer}.secondary{background:#f5e6ec;color:#704456}.danger{background:#eee;color:#75404f}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:8px;border-bottom:1px solid #f0e2e8;text-align:left}th{font-size:.9rem}td input,td textarea{min-width:90px}td textarea{min-height:75px}small{color:#8c7380}.status{font-size:.8rem;color:#48744e}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{flex:1}.archive{border-top:1px solid #eee;padding:12px 0}.archive:first-child{border:0}.install{display:none}.tag{display:inline-block;background:#f5e6ec;border-radius:20px;padding:3px 8px;font-size:.8rem}@media(max-width:500px){h1{font-size:1.3rem}}
</style></head>
<body><main><header><h1>🎙️ ラジオかるた記録帳</h1><p>放送回・50音・かるたの内容を記録</p></header>
<section class="panel"><div class="row"><div><label>第何回放送</label><input id="ep" placeholder="例：第1回"></div><div><label>日付（任意）</label><input id="date" type="date"></div></div>
<label>メモ（任意）</label><input id="memo" placeholder="出演者・テーマなど">
<div class="controls"><button id="add">＋ 記録行を追加</button><button class="secondary" id="save">保存</button><button class="secondary install" id="install">ホーム画面アプリをインストール</button></div><small>行の入力は自動保存。閉じてもこの端末内に残ります。</small></section>
<section class="panel"><label>記録検索</label><input id="search" placeholder="放送回・文字・カルタ内容で検索"><div class="controls"><button class="secondary" id="export">バックアップを書き出す</button><button class="secondary" id="importBtn">バックアップを読み込む</button><button class="danger" id="clear">全データ削除</button></div><input type="file" id="file" hidden accept="application/json"></section>
<section class="panel"><div class="tablewrap"><table><thead><tr><th style="width:22%">放送回</th><th style="width:15%">50音</th><th>カルタの内容</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><small id="count"></small></section>
<section class="panel"><h2 style="font-size:1.1rem">保存した記録</h2><div id="archive"></div></section><p class="status" id="status">保存準備中…</p></main>
<script>
const K=[..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
const $=id=>document.getElementById(id);let rows=JSON.parse(localStorage.getItem("karutaRows")||"[]"), archives=JSON.parse(localStorage.getItem("karutaArchives")||"[]");
function persist(){localStorage.setItem("karutaRows",JSON.stringify(rows));localStorage.setItem("karutaArchives",JSON.stringify(archives));$("status").textContent="✓ この端末に自動保存済み"}
function render(){let q=$("search").value.toLowerCase();let shown=rows.filter(r=>(r.ep+r.kana+r.text).toLowerCase().includes(q));$("tbody").innerHTML=shown.map(r=>`<tr data-id="${r.id}"><td><input class="epval" value="${esc(r.ep)}" placeholder="第○回"></td><td><select class="kval">${K.map(k=>`<option ${k===r.kana?"selected":""}>${k}</option>`).join("")}</select></td><td><textarea class="tval" placeholder="カルタの内容">${esc(r.text)}</textarea></td><td><button class="danger del">×</button></td></tr>`).join("");$("count").textContent=`${shown.length}件 / 全${rows.length}件`;
document.querySelectorAll("tr[data-id]").forEach(tr=>{let id=tr.dataset.id;tr.querySelector(".epval").oninput=e=>update(id,"ep",e.target.value);tr.querySelector(".kval").onchange=e=>update(id,"kana",e.target.value);tr.querySelector(".tval").oninput=e=>update(id,"text",e.target.value);tr.querySelector(".del").onclick=()=>{rows=rows.filter(r=>r.id!==id);persist();render()}});
renderArchive()}
function update(id,key,val){let r=rows.find(x=>x.id===id);if(r){r[key]=val;persist()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("add").onclick=()=>{rows.unshift({id:String(Date.now())+Math.random(),ep:$("ep").value,kana:"あ",text:""});persist();render();let t=$("tbody").querySelector("tr");t?.querySelector(".tval")?.focus()};
$("save").onclick=()=>{let ep=$("ep").value.trim();if(!ep){alert("放送回を入力してください");return}let group=rows.filter(r=>r.ep===ep);if(!group.length){alert("この放送回の記録行がありません");return}let archive={id:Date.now(),ep,date:$("date").value,memo:$("memo").value,rows:group,updated:new Date().toLocaleString()};let ix=archives.findIndex(a=>a.ep===ep);if(ix>=0){if(!confirm("同じ放送回の保存記録を更新しますか？"))return;archives[ix]=archive}else archives.unshift(archive);persist();renderArchive();alert("保存しました")};
$("search").oninput=render;$("export").onclick=()=>{let b=new Blob([JSON.stringify({rows,archives},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="radio-karuta-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("file").click();$("file").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());rows=d.rows||[];archives=d.archives||[];persist();render();alert("復元しました")}catch{alert("読み込みに失敗しました")}e.target.value=""};
$("clear").onclick=()=>{if(confirm("記録をすべて削除しますか？バックアップをおすすめします。")){rows=[];archives=[];persist();render()}};
function renderArchive(){let a=$("archive");a.innerHTML=archives.length?archives.map((x,i)=>`<div class="archive"><b>${esc(x.ep)}</b> <span class="tag">${esc(x.date||"日付なし")}</span><br><small>${esc(x.updated||"")}・${x.rows.length}行 ${esc(x.memo||"")}</small><div class="controls"><button class="secondary" data-open="${i}">この放送を表示</button><button class="danger" data-remove="${i}">保存記録を削除</button></div></div>`).join():"<small>保存した放送はまだありません</small>";a.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{let x=archives[+b.dataset.open];$("search").value=x.ep;render();window.scrollTo({top:0,behavior:"smooth"})});a.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(confirm("保存した放送記録を削除しますか？")){archives.splice(+b.dataset.remove,1);persist();renderArchive()}})}
render();
let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("install").style.display="block"});$("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
